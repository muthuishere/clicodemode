name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/codemode-wasm
      - run: GOOS=wasip1 GOARCH=wasm go build -o /dev/null ./cmd/codemode-wasi

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/build-wasm.sh
      - run: npm install && npm test
        working-directory: npm
      - run: node conformance/run-js.mjs npm/dist/index.js

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash scripts/build-wasi.sh
      - run: cargo test
        working-directory: rust
      - run: cargo clippy --all-targets
        working-directory: rust

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: bash python/scripts/check_python.sh
