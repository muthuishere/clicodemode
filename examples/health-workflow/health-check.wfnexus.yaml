name: health-check
steps:
  - id: inspect
    retry:
      max_attempts: 3
      backoff_sec: 2
    timeout_sec: 30
    run: democli code run-step ./steps/health.js#inspect
  - id: wait-ready
    needs: [inspect]
    until:
      - path: wait-ready.outcome
        equals: "ready"
    max_iterations: 5
    exit-codes:
      10: ready
      11: waiting
    run: "democli code run-step ./steps/health.js#poll --outcomes ready,waiting"
  - id: report
    needs: [inspect, wait-ready]
    run: democli code run-step ./steps/health.js#report
