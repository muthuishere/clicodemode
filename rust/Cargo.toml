[package]
name = "clicodemode"
version = "0.5.0"
edition = "2021"
description = "Code Mode for Rust CLIs: register your commands as operations; agents run small JavaScript-like programs that call them."
license = "MIT"
readme = "README.md"
include = ["src/**", "assets/codemode.wasm", "README.md", "examples/**", "tests/**"]

[dependencies]
wasmi = "2.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.test]
opt-level = 3
[profile.dev]
opt-level = 2
